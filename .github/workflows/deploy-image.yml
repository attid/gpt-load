# Собирает образ форка из ветки deploy и публикует его в GHCR.
# Файл живёт только на ветках local/ci-deploy и deploy; в main не попадает.
name: Deploy image

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Версия вычисляется по ближайшему тегу апстрима, нужны вся история и теги.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Версия вида <тег апстрима>.fork.<sha>: парсер releasecheck принимает
      # дополнительные идентификаторы в prerelease, но не build metadata.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          base="$(git describe --tags --abbrev=0 --match 'v2.*' 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            version="v0.0.0-fork.${short}"
          elif [[ "${base}" == *-* ]]; then
            version="${base}.fork.${short}"
          else
            version="${base}-fork.${short}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=deploy
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Web и Go собираются внутри Docker, прекомпилированных артефактов нет.
          target: source-build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          docker pull "${image}"
          docker run --rm "${image}" version | grep -Fx "GPT-Load ${EXPECTED_VERSION} (linux/amd64)"
          cid="$(docker run -d --rm -p 127.0.0.1:3001:3001 --tmpfs /app/data:uid=10001,gid=10001,mode=0700 "${image}")"
          trap 'docker stop "${cid}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health |
            jq -e --arg version "${EXPECTED_VERSION}" '.status == "ok" and .version == $version' >/dev/null
          docker stop "${cid}" >/dev/null
          echo "smoke ok: ${image} ${EXPECTED_VERSION}"
